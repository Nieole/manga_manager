# Manga Manager 配置模板 / configuration template
#
# 用法：复制为 config.yaml 后按需修改（config.yaml 已被 .gitignore 忽略，不会入库）。
#   cp config.example.yaml config.yaml
# Usage: copy to config.yaml and edit as needed (config.yaml is gitignored).
#
# 首次启动时若 config.yaml 不存在，程序也会自动在工作目录生成一份默认配置。
# 本文件仅作为字段结构与默认值的参考，请勿在此填入真实密钥。

server:
    host: 0.0.0.0
    port: 8080
    allowed_origins:
        - http://*
        - https://*
    # 可信反向代理的 CIDR 列表。只有直连对端落在这些网段内时，才采信
    # X-Forwarded-For / X-Real-IP 里的客户端 IP。留空 = 一律不信任转发头。
    # 限流（登录暴破、OPDS/Mihon 的 bcrypt CPU-DoS 防护）以客户端 IP 为分桶键，
    # 无条件采信转发头等于让攻击者换个头就换一个新桶。直连部署保持留空即可；
    # 套了 Nginx/Caddy/Traefik 的部署填上代理所在网段，例如：
    #   trusted_proxies: ["127.0.0.1/32", "::1/128", "172.17.0.0/16"]
    trusted_proxies: []
    # 会话 Cookie 的 Secure 标志由谁说了算：auto（默认）/ always / never。
    #
    #   auto   直连 TLS，或**可信**代理（见上面的 trusted_proxies）声明
    #          X-Forwarded-Proto: https 时才带 Secure。未登记的对端声明 https 会被忽略
    #          并在日志里告警一次 —— 否则任何客户端都能自己决定这个标志。
    #   always 无条件带。给「TLS 在反代终结、但不打算把反代网段填进 trusted_proxies」
    #          的部署一个明确出口：这两件事本来就是独立决定，不该被迫二选一。
    #   never  无条件不带。反向逃生口：反代错误地声明了 https 而实际服务明文时，
    #          Secure 会让浏览器直接丢弃 Cookie，登录彻底失效，这时需要能手动压回去。
    #
    # 反代终结 TLS 的部署二选一即可：要么把代理网段填进 trusted_proxies（同时也修好限流的真实 IP），
    # 要么在这里写 always。写错的值会回落 auto 并在启动日志告警。
    cookie_secure: auto
database:
    path: ./data/manga.db
library:
    paths: []
    storage_profile: auto
    io_policy:
        scan_concurrency: 0
        archive_open_concurrency: 0
        cover_concurrency: 0
        hash_concurrency: 0
        pause_background_when_reading: false
        idle_only_heavy_tasks: false
        disable_same_disk_page_cache: false
    storage_policies: []
cache:
    dir: ./data/cache
    page_disk_cache_enabled: false
scanner:
    workers: 0
    scan_profile: metadata_scan
    thumbnail_format: webp
    waifu2x_path: ""
    realcugan_path: ""
    archive_pool_size: 5
    max_ai_concurrency: 3
ollama:
    endpoint: ""
    model: ""
llm:
    provider: ollama
    api_mode: ""
    base_url: http://localhost:11434
    request_path: ""
    endpoint: http://localhost:11434
    model: qwen2.5
    api_key: ""        # 切勿把真实密钥提交到版本库 / never commit a real API key
    timeout: 120
scrapers:
    # AniList / MangaDex 免密钥，无需配置。
    # MyAnimeList 需要 Client ID，Comic Vine 需要 API Key；留空则对应刮削源不可用。
    mal_client_id: ""       # 切勿把真实凭据提交到版本库 / never commit a real credential
    comicvine_api_key: ""   # 切勿把真实密钥提交到版本库 / never commit a real API key
protocols:
    opds:
        enabled: false
    mihon:
        enabled: false
koreader:
    enabled: false
    base_path: /koreader
    allow_registration: false
    match_mode: binary_hash
    path_ignore_extension: false
