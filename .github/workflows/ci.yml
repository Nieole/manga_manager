name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # 供 release.yml 复用：发布前必须先跑完整的 lint / 测试 / 漏洞扫描 / 契约漂移门禁，
  # 否则「只要打了 tag 就直接构建并发布二进制」——CI 的所有把关对发布物一律失效。
  workflow_call:

permissions:
  contents: read

env:
  # 所有 action 现已原生 node24，这个开关是**安全网**而不是必需项：
  # 万一将来某次依赖升级又引入一个仍在 node20 的 action，它能让其继续跑在 node24 上，
  # 而不是等 GitHub 从 runner 上彻底移除 node20 那天 CI 突然全红。
  # 它不会掩盖弃用告警——告警照样会打出来，正是靠它才发现有四个 action 还在 node20。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14 # darwin/arm64 is a released target — exercise it on PRs (CGO + WebP + path handling)

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run go vet
        run: go vet ./...

      - name: Lint Go (golangci-lint)
        if: matrix.os == 'ubuntu-latest'
        # golangci-lint-action v8+ 要求 golangci-lint >= v2.1.0（下面钉的是 v2.12.2）。
        # v9 是把运行时从 node20 搬到 node24 的那一版——GitHub 已弃用 node20，
        # 留在 v7 只会一直被强制降级运行并刷弃用告警。
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Scan Go dependencies for vulnerabilities (govulncheck)
        if: matrix.os == 'ubuntu-latest'
        # Fails the build on any known CVE reachable from our code (x/image decode paths etc.).
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Run Go tests
        run: go test ./...

      - name: Run Go tests with race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Verify sqlc generated code is up to date
        if: matrix.os == 'ubuntu-latest'
        # sqlc v1.31.1 需 Go >= 1.26 才能构建，而本作业固定用 Go 1.25 且 setup-go 设了 GOTOOLCHAIN=local。
        # 仅在本步放开为 auto，让 go install 自动拉取构建 sqlc 所需的更新工具链（不影响其余步骤的 1.25 构建）。
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          # 用 git status 而非 git diff：后者看不见新生成的**未跟踪**文件，
          # 新增 query 却漏提交产物时会被静默放行。
          if [[ -n "$(git status --porcelain -- internal/database)" ]]; then
            echo "::error::sqlc 产物与仓库不一致，请在本地跑 sqlc generate 后提交"
            git status --porcelain -- internal/database
            git diff -- internal/database
            exit 1
          fi
        # sqlc 在 stderr 输出的 "mismatched input" 为非致命诊断，Linux 下退出码 0；
        # 若生成产物与仓库不一致（drift）则 git diff 失败，CI 报错。

      - name: Verify generated TS contract types are up to date
        if: matrix.os == 'ubuntu-latest'
        # cmd/tsgen 以 Go 后端响应结构体为单一事实源生成 web/src/api/generated.ts（M47）。
        # 若源结构体改了却没重新生成，git diff 失败、CI 报错，防止手写/生成类型与后端漂移。
        run: |
          go run ./cmd/tsgen
          if [[ -n "$(git status --porcelain -- web/src/api/generated.ts)" ]]; then
            echo "::error::生成的 TS 契约与仓库不一致，请在本地跑 go run ./cmd/tsgen 后提交"
            git diff -- web/src/api/generated.ts
            exit 1
          fi

      - name: Verify server build
        # WebP encoding (chai2010/webp) requires CGO; make it explicit rather than relying on the
        # runner image default so a WebP-less binary can never be produced unnoticed.
        env:
          CGO_ENABLED: "1"
        run: go build -o build/manga-manager-ci ./cmd/server
