name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # 所有 action 现已原生 node24，这个开关是**安全网**而不是必需项：
  # 万一将来某次依赖升级又引入一个仍在 node20 的 action，它能让其继续跑在 node24 上，
  # 而不是等 GitHub 从 runner 上彻底移除 node20 那天 CI 突然全红。
  # 它不会掩盖弃用告警——告警照样会打出来，正是靠它才发现有四个 action 还在 node20。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # 发布前先跑一遍完整 CI（三平台 lint/测试/race/漏洞扫描/契约漂移）。
  # 此前 release 只要看到 tag 就直接构建并发布，CI 的所有门禁对发布物形同虚设。
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve build version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            EXT=".exe"
          else
            EXT=""
          fi

          OUTPUT_NAME="manga-manager-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "output_name=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build server binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # WebP encoding (chai2010/webp) requires CGO. Each target builds natively on its own runner,
          # so make CGO explicit rather than relying on the runner image default.
          CGO_ENABLED: "1"
        run: |
          mkdir -p build
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build \
            -ldflags="-s -w -X 'main.Version=${{ steps.meta.outputs.version }}' -X 'main.Commit=${GITHUB_SHA}' -X 'main.BuildTime=${BUILD_TIME}'" \
            -o "build/${{ steps.meta.outputs.output_name }}" \
            ./cmd/server

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.output_name }}
          path: build/${{ steps.meta.outputs.output_name }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        # Lets self-hosters verify binary integrity/provenance before running an internet-facing server.
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-artifacts/*
